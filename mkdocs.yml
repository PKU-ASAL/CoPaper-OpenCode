site_name: Copaper
site_description: Copaper - 你的论文助手
site_url: ""

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

nav:
  - 中文: index.md
  - English: en.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

extra:
  alternate:
    - name: 中文
      link: /
      lang: zh
    - name: English
      link: /en/
      lang: en
