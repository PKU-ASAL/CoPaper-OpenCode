[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibepaper"
version = "0.1.0"
description = "AI-assisted academic writing framework with structured phase management"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "VibePaper Team"},
]
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "gitpython>=3.1",
    "openai>=1.40",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
vibe = "vibepaper.cli:main"

[tool.setuptools.packages.find]
include = ["vibepaper*"]

[tool.setuptools.package-data]
vibepaper = ["scaffold/**/*", "scaffold/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests",
    "slow: marks tests as slow",
]